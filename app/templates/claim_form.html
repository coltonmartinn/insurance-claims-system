{% extends "base.html" %}
{% block title %}File a Claim{% endblock %}
{% block content %}
<h1>File a Claim</h1>
<p class="subtitle">Submitting runs the claim through automatic risk triage. Low-risk, low-value claims may be auto-cleared; everything else goes to an adjuster.</p>

<div class="card">
  <form method="post" enctype="multipart/form-data">
    <label for="policy_id">Policy</label>
    <select name="policy_id" id="policy_id" required>
      <option value="" disabled selected>Select a policy&hellip;</option>
      {% for policy in policies %}
        <option value="{{ policy.id }}">#{{ policy.id }} &mdash; {{ policy.policyholder.name }} &mdash; {{ policy.vehicle_year }} {{ policy.vehicle_make }} {{ policy.vehicle_model }} (limit ${{ "%.0f"|format(policy.coverage_limit) }})</option>
      {% endfor %}
    </select>

    <div class="grid-2">
      <div>
        <label for="incident_type">Incident type</label>
        <select name="incident_type" id="incident_type" required>
          {% for t in incident_types %}
            <option value="{{ t }}">{{ t.replace('_',' ')|title }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="incident_date">Incident date</label>
        <input type="date" name="incident_date" id="incident_date" max="{{ today }}" required>
      </div>
    </div>

    <label for="claimed_amount">Claimed amount ($)</label>
    <input type="number" name="claimed_amount" id="claimed_amount" min="0" step="0.01" required>

    <label for="description">Description</label>
    <textarea name="description" id="description" required placeholder="What happened?"></textarea>

    <label for="photo">Photo or document (optional)</label>
    <input type="file" name="photo" id="photo" accept=".png,.jpg,.jpeg,.gif,.pdf">

    <button type="submit">Submit Claim</button>
  </form>
</div>
{% endblock %}

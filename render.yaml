# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploy: on render.com, "New" -> "Blueprint" -> connect this repo. Render
# reads this file and provisions the service with no further config.
# SECRET_KEY and CLAIMS_API_KEY are generated by Render itself (never
# committed), matching the env vars app/__init__.py already reads.
#
# Free-tier note: the container's filesystem (and therefore the seeded
# SQLite database) resets whenever the service redeploys or spins back up
# from an idle sleep. That's a feature for a public demo, not a bug: it
# means the demo can never be left in a broken state by a visitor.
services:
  - type: web
    name: insurance-claims-triage
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CLAIMS_API_KEY
        generateValue: true
